[project]
name = "porters-decisions"
version = "0.1.0"
description = "Garnishment letter extraction-to-decision service"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "pydantic>=2.14.2",
    "pydantic-ai>=2.65.0",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "ty>=0.0.96",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # mutually exclusive pydocstyle pairs: keep D211 and D212
    "D203",
    "D213",
    # conflicts with `ruff format` (https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules)
    "COM812",
    # OPEN: who holds the copyright (and under which licence) is not decided; enable once it is
    "CPY001",
]

[tool.ruff.lint.per-file-ignores]
# pytest checks with plain `assert` (what PT009 and PT027 require), which S101 forbids
"tests/**" = ["S101"]

[tool.ruff.lint.flake8-type-checking]
# Pydantic, SQLAlchemy and FastAPI read these annotations at runtime, so their imports must stay real
runtime-evaluated-base-classes = ["pydantic.BaseModel", "app.core.database.Base"]
runtime-evaluated-decorators = ["fastapi.APIRouter.get", "fastapi.APIRouter.post"]
