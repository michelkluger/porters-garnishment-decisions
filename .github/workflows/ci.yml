name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run ty check
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  quickstart:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Start and check in one step: a process a step leaves running may not outlive it (Windows).
      # A bare PATH hides any preinstalled uv or Bun, so the script has to install its own.
      # Passes once the frontend answers and reaches the backend; stops early if the script exits.
      - name: Quick start (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          PATH=/usr/bin:/bin ./start.sh > quickstart.log 2>&1 &
          for i in $(seq 150); do
            curl -fs -o /dev/null 127.0.0.1:3000/api/docs && exit 0
            kill -0 $! 2>/dev/null || break
            sleep 2
          done
          cat quickstart.log; exit 1
      - name: Quick start (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:Path = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          $p = Start-Process powershell -ArgumentList "-ExecutionPolicy", "Bypass", "-File", "start.ps1" -RedirectStandardOutput quickstart.log -RedirectStandardError quickstart.err -PassThru
          for ($i = 0; $i -lt 150 -and -not $p.HasExited; $i++) {
            try { Invoke-WebRequest http://127.0.0.1:3000/api/docs -TimeoutSec 2 | Out-Null; exit 0 } catch { Start-Sleep 2 }
          }
          Get-Content quickstart.log, quickstart.err; exit 1
